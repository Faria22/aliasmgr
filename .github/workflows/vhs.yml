name: VHS recordings

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recordings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install VHS dependencies
        env:
          VHS_ARCHIVE: vhs_0.11.0_Linux_x86_64.tar.gz
          VHS_SHA256: 99cb634587eaae0473c1ea377db80c3a048c27f99fe0a7febb1a1e8cb7ee5009
          TTYD_SHA256: 8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55
        run: |
          tools_dir="$RUNNER_TEMP/vhs-tools"
          mkdir -p "$tools_dir"

          curl --fail --location --silent --show-error \
            "https://github.com/charmbracelet/vhs/releases/download/v0.11.0/$VHS_ARCHIVE" \
            --output "$RUNNER_TEMP/$VHS_ARCHIVE"
          echo "$VHS_SHA256  $RUNNER_TEMP/$VHS_ARCHIVE" | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/$VHS_ARCHIVE" \
            --strip-components=1 \
            --directory "$tools_dir" \
            vhs_0.11.0_Linux_x86_64/vhs

          curl --fail --location --silent --show-error \
            "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" \
            --output "$tools_dir/ttyd"
          echo "$TTYD_SHA256  $tools_dir/ttyd" | sha256sum --check
          chmod +x "$tools_dir/vhs" "$tools_dir/ttyd"
          echo "$tools_dir" >> "$GITHUB_PATH"

          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Render recordings
        run: ./scripts/render-vhs.sh
      - name: Check committed recording transcripts
        run: git diff --exit-code -- 'docs/assets/*.txt'
      - name: Upload generated recordings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-vhs-recordings
          path: |
            docs/assets/*.gif
            docs/assets/*.txt
          if-no-files-found: ignore
