[package]
name = "aliasmgr"
version = "2.0.0"
description = "A clean and simple CLI alias manager"
authors = ["Felipe Faria <fariafelipe22@outlook.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Faria22/aliasmgr"
categories = ["command-line-utilities"]
keywords = ["aliases", "shell", "cli", "manager"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "0.29.0"
cross-xdg = "2.0.0"
dialoguer = "0.12.0"
env_logger = "0.11.8"
globset = "0.4.18"
log = "0.4.28"
owo-colors = "4.2.3"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
toml_edit = "0.23.7"
terminal_size = "0.4.3"
tempfile = "3.23.0"
unicode-width = "0.2.2"

[dev-dependencies]
assert_fs = "1.1.3"
assert_matches = "1.5.0"
temp-env = "0.3.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
